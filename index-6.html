<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>PI — Public Intelligence · Ask PI, not AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--b1:#121212;--b2:#181818;--b3:#212121;--line:#3a3a3a;--line2:#606060;--t:#f2f2f2;--t2:#b3b3b3;--t3:#828282;--ac:#ffffff;--red:#c9c9c9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg) radial-gradient(circle,rgba(255,255,255,.05) 1px,transparent 1.2px) 0 0/14px 14px;color:var(--t);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--t);background:var(--b2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;width:100%;font-size:15px}
input:focus,textarea:focus{border-color:var(--line2);background:var(--b3)}
textarea{resize:vertical;min-height:100px;line-height:1.5}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,10,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.in{max-width:760px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.brand{display:flex;align-items:baseline;gap:8px}
.mark{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:28px;letter-spacing:-.03em;line-height:1}.mark em{font-style:normal;color:var(--t2);font-weight:400;text-transform:none}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);letter-spacing:.15em;text-transform:uppercase;display:none}
@media(min-width:520px){.tag{display:inline}}
.chip{display:none;align-items:center;gap:10px}
.pill{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--b2);border:1px solid var(--line);padding:6px 10px;border-radius:999px;color:var(--t2);white-space:nowrap}.pill b{color:var(--t)}
.av{width:36px;height:36px;border-radius:3px;background:var(--b3);border:2px solid var(--t2);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t);font-weight:700}
.menu{position:absolute;top:58px;right:12px;background:var(--b1);border:1px solid var(--line2);border-radius:12px;padding:8px;min-width:210px;z-index:60;display:none}
.menu.show{display:block}
.mi{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;font-size:13px;color:var(--t2);width:100%;text-align:left}
button.mi:hover{background:var(--b3);color:var(--t)}.mi small{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3)}
.cats{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:calc(61px + env(safe-area-inset-top,0));z-index:30}
.cats .in{overflow-x:auto;padding:10px 14px;gap:6px;justify-content:flex-start;scrollbar-width:none}.cats .in::-webkit-scrollbar{display:none}
.cat{flex:none;font-size:13px;padding:8px 14px;border-radius:3px;color:var(--t2);border:2px solid var(--line);white-space:nowrap;font-weight:600}
.cat:hover{color:var(--t);border-color:var(--t2)}.cat.on{background:var(--ac);color:#0a0a0a;border-color:var(--ac);font-weight:800}
.feed{flex:1;max-width:760px;width:100%;margin:0 auto;padding:14px 14px 190px;display:flex;flex-direction:column;gap:12px}
.qc{background:var(--b1);border:2px solid var(--line);border-radius:4px;padding:16px 18px;animation:f .3s ease;box-shadow:5px 5px 0 rgba(255,255,255,.05)}
.qc:hover{border-color:var(--t);box-shadow:5px 5px 0 rgba(255,255,255,.1)}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.meta{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);margin-bottom:10px;flex-wrap:wrap}
.qcat{background:var(--b3);color:var(--t2);padding:3px 8px;border-radius:2px;text-transform:uppercase;letter-spacing:.08em;font-size:10px;border:1px solid var(--line2)}
.qt{font-family:'Anton',sans-serif;font-size:19px;text-transform:none;line-height:1.35;letter-spacing:-.01em;margin:0 0 14px;font-weight:600;overflow-wrap:anywhere}
@media(min-width:640px){.qt{font-size:22px}}
.ab{border-left:2px solid var(--line2);padding:2px 0 2px 14px;margin-top:8px}
.al{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.at{font-size:15px;line-height:1.55;color:var(--t2);white-space:pre-wrap;overflow-wrap:anywhere}
.ae{font-size:14px;color:var(--t3);font-style:italic}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.votes{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--t2)}.votes b{color:var(--t)}
.lb{font-size:13px;color:var(--t2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}.lb:hover{color:var(--t)}
.compose{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(to top,var(--bg) 60%,rgba(10,10,10,0));padding:14px 12px calc(14px + env(safe-area-inset-bottom,0))}
.sp{position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:8px;width:calc(100% - 24px);max-width:736px;background:var(--b1);border:2px solid var(--t2);border-radius:4px;max-height:280px;overflow-y:auto;display:none;box-shadow:6px 6px 0 rgba(255,255,255,.06);z-index:55}
.sp.show{display:block}
.spi{padding:12px 14px;border-bottom:1px solid var(--line)}.spi:last-child{border-bottom:none}.spi:hover{background:var(--b2)}
.spq{font-size:14px;font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
.spa{font-size:12.5px;color:var(--t2);overflow-wrap:anywhere}
.spm{font-size:11px;color:var(--t3);margin-top:4px;font-family:'JetBrains Mono',monospace}
.ci{max-width:760px;margin:0 auto;background:var(--b2);border:2px solid var(--t2);border-radius:6px;padding:10px 10px 10px 14px;display:flex;align-items:flex-end;gap:8px}
.ci:focus-within{border-color:#4a4a4a}
.ci select{background:transparent;border:none;padding:8px 4px;font-size:12px;color:var(--t2);font-family:'JetBrains Mono',monospace;flex:none;width:105px}
.ci textarea{flex:1;background:transparent;border:none;padding:8px 4px;min-height:24px;max-height:120px;resize:none;line-height:1.4}
.ci textarea::placeholder{color:var(--t3)}
.send{width:38px;height:38px;border-radius:3px;background:var(--ac);color:#0a0a0a;flex:none;font-weight:800;font-size:18px;border:2px solid #000}
.hint{max-width:760px;margin:6px auto 0;padding:0 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);display:flex;justify-content:space-between;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.ov.show{display:flex}
.modal{background:var(--b1);border:2px solid var(--t2);border-radius:6px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px;position:relative;box-shadow:8px 8px 0 rgba(255,255,255,.05)}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:3px;background:var(--b2);color:var(--t2);font-size:18px;border:2px solid var(--line2);font-weight:800}
.modal h2{font-family:'Anton',sans-serif;font-weight:400;font-size:26px;text-transform:uppercase;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--t3);font-size:14px;margin:0 0 20px}
.fld{margin-bottom:12px}.fld label,.lbl{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.pri{width:100%;background:var(--ac);color:#0a0a0a;padding:13px;border-radius:4px;font-weight:800;font-size:15px;margin-top:8px;border:2px solid #000;text-transform:uppercase;letter-spacing:.03em}.pri:disabled{opacity:.4}
.gho{width:100%;color:var(--t2);padding:11px;border-radius:4px;font-size:14px;margin-top:8px;border:2px solid var(--line2);font-weight:700}.gho:hover{color:var(--t);border-color:var(--t2)}
.sw{text-align:center;font-size:13px;color:var(--t3);margin-top:14px}.sw b{color:var(--t);cursor:pointer;text-decoration:underline}
.err{color:var(--red);font-size:13px;min-height:18px;font-family:'JetBrains Mono',monospace}
.qdh{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line);padding-right:30px}
.ai{background:var(--b2);border:2px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.ait{font-size:14.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px}
.aif{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t3);flex-wrap:wrap}
.vb{padding:5px 10px;border-radius:3px;background:var(--b3);border:2px solid var(--line2);font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--t2);font-weight:700}
.vb:hover{border-color:var(--line2);color:var(--t)}.vb.up{background:var(--t);color:#0a0a0a;border-color:var(--t)}.vb.dn{background:#3a3a3a;color:var(--t);border-color:#4a4a4a}
.rp{color:var(--t3);font-size:11px;padding:4px 8px}.rp:hover{color:var(--red)}
.addw{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.addw textarea{margin-bottom:8px}
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:var(--b3);border:1px solid var(--line2);padding:10px 18px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;font-family:'JetBrains Mono',monospace;max-width:92%;text-align:center}.toast.show{opacity:1}
.empty{text-align:center;padding:60px 20px;color:var(--t3)}.empty h3{font-family:'Anton',sans-serif;font-size:20px;text-transform:uppercase;color:var(--t2);margin:0 0 6px}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="#" id="home" style="text-decoration:none;color:inherit"><span class="mark">PI<em>.</em></span><span class="tag">Ask PI, not AI</span></a>
  <div class="chip" id="chip"><span class="pill">◈ <b id="cr">0</b> credit</span><button class="av" id="avBtn"><span id="idShort">PI</span></button>
    <div class="menu" id="menu">
      <div class="mi"><span>Identity</span><small id="idFull"></small></div>
      <div class="mi"><span>Today's votes</span><small><span id="dv">0</span>/5</small></div>
      <div class="mi"><span>Today's answers</span><small><span id="da">0</span>/5</small></div>
      <button class="mi" id="out"><span>Sign out</span><small>→</small></button>
    </div></div>
  <button class="pri" id="sinBtn" style="width:auto;padding:8px 16px;margin:0;font-size:13px">Sign in</button>
</div></header>
<nav class="cats"><div class="in" id="tabs"></div></nav>
<main class="feed" id="feed"><div class="empty">Loading…</div></main>

<div class="compose">
  <div class="sp" id="sp"></div>
  <div class="ci"><select id="ccat"></select><textarea id="cin" rows="1" maxlength="500" placeholder="Ask real people anything..."></textarea><button class="send" id="send">↑</button></div>
  <div class="hint"><span>1 credit = 1 question · earn by voting or answering</span><span id="hr"></span></div>
</div>

<div class="ov" id="aov"><div class="modal">
  <button class="x" data-close="aov">×</button>
  <h2 id="at">Join PI</h2><p class="sub" id="as">Anonymous. No name, no photo. Just questions.</p>
  <div class="fld" id="nickw"><label>Nickname (optional)</label><input id="nick" maxlength="20" placeholder="Leave blank for PI-####"></div>
  <div class="fld"><label>Email</label><input type="email" id="em" autocomplete="email" placeholder="you@somewhere.com"></div>
  <div class="fld"><label>Password</label><input type="password" id="pw" autocomplete="current-password" placeholder="At least 6 characters"></div>
  <div class="err" id="err"></div>
  <button class="pri" id="go">Create account</button>
  <button class="gho" id="gg">Continue with Google</button>
  <div class="sw" id="swl"></div>
</div></div>

<div class="ov" id="qov"><div class="modal">
  <button class="x" data-close="qov">×</button>
  <div class="qdh"><div class="meta"><span class="qcat" id="qdc"></span><span id="qdm"></span></div><div class="qt" id="qdt" style="margin:8px 0 0"></div></div>
  <div id="alist"></div>
  <div class="addw" id="addw"><span class="lbl">Your answer</span>
    <textarea id="ain" placeholder="Share what you know."></textarea>
    <button class="pri" id="sub" style="margin-top:0">Post answer</button>
    <div class="sub" style="margin:8px 0 0;font-size:12px">+1 credit for every 5 answers a day</div></div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,GoogleAuthProvider,signInWithPopup}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,collection,query,orderBy,limit,where,getDocs,runTransaction,serverTimestamp,increment}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyCGt7is15VmSXzxWUmTY5ydUvCezOUiUNw",authDomain:"public-intelligence.firebaseapp.com",projectId:"public-intelligence",storageBucket:"public-intelligence.firebasestorage.app",messagingSenderId:"761508543647",appId:"1:761508543647:web:13c3eb848aebb3d45f76aa",measurementId:"G-76TL0KCGVT"});
const auth=getAuth(app),db=getFirestore(app);
const CATS=["Startup Ideas","General Questions","Subject-Related","Human Nature / Feelings","Research / Specific Knowledge","Opinions / Debates"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const rand=()=>"PI-"+(1000+Math.floor(Math.random()*9000));
const ago=ts=>{if(!ts)return"just now";const s=Math.floor((Date.now()-ts.toDate().getTime())/1000);return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"};
const score=a=>a.upvotes-a.downvotes;
let user=null,profile=null,cat="All",view="feed",qs=[],top={},cnt={},active=null,myVotes={},mode="signup",pendingNick="",answerT0=0;
const STOP=new Set(["a","an","the","is","are","was","were","am","be","been","being","i","you","he","she","it","we","they","my","your","his","her","its","our","their","this","that","these","those","of","to","in","on","at","by","for","with","about","as","into","like","through","after","over","between","out","against","during","without","before","under","around","among","and","or","but","if","so","do","does","did","not","no","yes","what","who","whom","which","how","why","when","where","can","could","will","would","should","shall","may","might","must","than","then","there","here","just","also","very","really","get","got","has","have","had"]);
const tokenize=s=>(String(s).toLowerCase().match(/[a-z0-9']+/g)||[]).filter(w=>w.length>1&&!STOP.has(w));
let sIndex={questions:[],top:{},loaded:false,loading:false},sTimer=null;

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600)}
const open=id=>{$(id).classList.add("show");document.body.style.overflow="hidden"};
const close=id=>{$(id).classList.remove("show");document.body.style.overflow="";if(id==="qov")loadFeed()};
function bump(d,k){const t=today();let v=d.daily_votes_count,n=d.daily_answers_count,c=d.credit_balance;
 if(d.last_reset_date!==t){v=0;n=0}
 if(k==="votes"){v++;if(v===5)c++}else{n++;if(n===5)c++}
 return{daily_votes_count:v,daily_answers_count:n,credit_balance:c,last_reset_date:t}}

/* tabs */
function tabs(){const mine=user?`<button class="cat ${view==="mine"?"on":""}" data-mine="1">★ My Questions</button>`:"";
 $("tabs").innerHTML=mine+["All",...CATS].map(c=>`<button class="cat ${view==="feed"&&c===cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
 $("ccat").innerHTML=CATS.map(c=>`<option ${c===cat?"selected":""}>${esc(c)}</option>`).join("")}

/* profile */
async function ensureProfile(u){const r=doc(db,"users",u.uid);let s=await getDoc(r);
 if(!s.exists()){await setDoc(r,{display_id:pendingNick||rand(),credit_balance:3,daily_votes_count:0,daily_answers_count:0,last_reset_date:today(),created_at:serverTimestamp()});s=await getDoc(r)}
 return s.data()}
const refreshProfile=async()=>{profile=(await getDoc(doc(db,"users",user.uid))).data();paint()};
function paint(){
 $("chip").style.display=user&&profile?"flex":"none";$("sinBtn").style.display=user?"none":"inline-block";
 if(!user||!profile){$("hr").textContent="Sign in to ask";return}
 const f=profile.last_reset_date===today();
 $("cr").textContent=profile.credit_balance;$("dv").textContent=f?profile.daily_votes_count:0;$("da").textContent=f?profile.daily_answers_count:0;
 $("idShort").textContent=(profile.display_id||"PI").split("-")[1]||"PI";$("idFull").textContent=profile.display_id;
 $("hr").textContent=profile.credit_balance>0?`You have ${profile.credit_balance}`:"Earn credit: vote/answer 5×"}

/* feed */
async function loadFeed(){
 if(view==="mine")return loadMine();
 try{const[q,a]=await Promise.all([getDocs(query(collection(db,"questions"),orderBy("created_at","desc"),limit(60))),getDocs(query(collection(db,"answers"),orderBy("created_at","desc"),limit(400)))]);
  qs=q.docs.map(x=>({id:x.id,...x.data()}));top={};cnt={};
  a.forEach(x=>{const r={id:x.id,...x.data()};if((r.report_count||0)>=3)return;cnt[r.question_id]=(cnt[r.question_id]||0)+1;if(!top[r.question_id]||score(r)>score(top[r.question_id]))top[r.question_id]=r});
  renderFeed()}
 catch(e){$("feed").innerHTML=`<div class="empty"><h3>Can't reach the feed</h3><p>${esc(e.message)}</p></div>`}}
async function loadMine(){
 if(!user){view="feed";tabs();return loadFeed()}
 $("feed").innerHTML='<div class="empty">Loading…</div>';
 try{const q=await getDocs(query(collection(db,"questions"),where("user_id","==",user.uid),orderBy("created_at","desc")));
  qs=q.docs.map(x=>({id:x.id,...x.data()}));top={};cnt={};
  await Promise.all(qs.map(async qq=>{const a=await getDocs(query(collection(db,"answers"),where("question_id","==",qq.id)));
   a.forEach(x=>{const r={id:x.id,...x.data()};if((r.report_count||0)>=3)return;cnt[qq.id]=(cnt[qq.id]||0)+1;if(!top[qq.id]||score(r)>score(top[qq.id]))top[qq.id]=r})}));
  renderFeed(true)}
 catch(e){$("feed").innerHTML=`<div class="empty"><h3>Can't load your questions</h3><p>${esc(e.message)}</p></div>`}}
function renderFeed(mineView){
 const list=mineView?qs.slice().sort((x,y)=>(y.created_at?.toMillis()||0)-(x.created_at?.toMillis()||0)):qs.filter(q=>cat==="All"||q.category===cat).sort((x,y)=>(top[y.id]?score(top[y.id]):-1e9)-(top[x.id]?score(top[x.id]):-1e9));
 $("feed").innerHTML=list.length?list.map(q=>{const a=top[q.id],n=a?a.upvotes+a.downvotes:0,p=n?Math.round(a.upvotes/n*100):0,c=cnt[q.id]||0;
  return`<article class="qc"><div class="meta"><span class="qcat">${esc(q.category)}</span><span>${ago(q.created_at)}</span></div>
  <h3 class="qt">${esc(q.text)}</h3>
  ${a?`<div class="ab"><div class="al">Top answer</div><div class="at">${esc(a.text)}</div></div>`:`<div class="ab"><div class="ae">No answers yet — be the first.</div></div>`}
  <div class="foot"><div class="votes">${a?`<b>${p}%</b> agree · ${n} vote${n===1?"":"s"}`:"0 answers"}</div><button class="lb" data-open="${q.id}">${mineView?(c>0?`${c} answer${c===1?"":"s"} →`:"No answers yet →"):(c>1?`View ${c} answers →`:"Answer this →")}</button></div></article>`}).join(""):(mineView?`<div class="empty"><h3>You haven't asked anything yet</h3><p>Your questions will show up here.</p></div>`:`<div class="empty"><h3>Nothing here yet</h3><p>Be the first to ask a real question.</p></div>`)}

/* detail */
async function openQ(id){active=qs.find(q=>q.id===id)||sIndex.questions.find(q=>q.id===id);if(!active)return;
 $("qdc").textContent=active.category;$("qdm").textContent=ago(active.created_at);$("qdt").textContent=active.text;
 $("ain").value="";answerT0=0;$("alist").innerHTML='<div class="empty" style="padding:20px">Loading…</div>';open("qov");await loadAnswers()}
async function loadAnswers(){
 try{const s=await getDocs(query(collection(db,"answers"),where("question_id","==",active.id)));
  if(user){myVotes={};const v=await getDocs(query(collection(db,"votes"),where("user_id","==",user.uid)));v.forEach(x=>myVotes[x.data().answer_id]=x.data().vote_type)}
  const all=s.docs.map(x=>({id:x.id,...x.data()})),list=all.filter(a=>(a.report_count||0)<3).sort((a,b)=>score(b)-score(a));
  $("addw").style.display=user&&!all.some(a=>a.user_id===user.uid)?"block":"none";
  $("alist").innerHTML=list.map(a=>{const n=a.upvotes+a.downvotes,p=n?Math.round(a.upvotes/n*100):0,m=myVotes[a.id];
   return`<div class="ai"><div class="ait">${esc(a.text)}</div><div class="aif"><div><button class="vb ${m==="up"?"up":""}" data-v="up" data-id="${a.id}">▲ ${a.upvotes}</button> <button class="vb ${m==="down"?"dn":""}" data-v="down" data-id="${a.id}">▼ ${a.downvotes}</button> <span>${p}%</span></div>
   <div><span>${ago(a.created_at)}</span> <button class="rp" data-rep="${a.id}">report</button></div></div></div>`}).join("")||'<div class="empty" style="padding:20px">No answers yet.</div>'}
 catch(e){$("alist").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

/* auth */
function setMode(m){mode=m;$("err").textContent="";const s=m==="signup";
 $("at").textContent=s?"Join PI":"Welcome back";$("as").textContent=s?"Anonymous. No name, no photo. Just questions.":"Sign in to your PI identity.";
 $("nickw").style.display=s?"block":"none";$("go").textContent=s?"Create account (3 free credits)":"Sign in";
 $("swl").innerHTML=s?'Already have an account? <b data-mode="signin">Sign in</b>':'New here? <b data-mode="signup">Create account</b>'}
function openAuth(m){setMode(m);open("aov")}
async function doAuth(){const em=$("em").value.trim(),pw=$("pw").value;$("err").textContent="";
 if(!em||!pw){$("err").textContent="Fill both fields.";return}
 $("go").disabled=true;
 try{if(mode==="signup"){pendingNick=$("nick").value.trim().slice(0,20);await createUserWithEmailAndPassword(auth,em,pw)}else await signInWithEmailAndPassword(auth,em,pw);
  close("aov");$("em").value=$("pw").value=""}
 catch(e){$("err").textContent=e.message.replace("Firebase: ","")}
 $("go").disabled=false}

/* ask */
async function ask(){
 if(!user){openAuth("signup");return}
 const text=$("cin").value.trim(),c=$("ccat").value;if(text.length<5){toast("Question too short");return}
 const uref=doc(db,"users",user.uid),qref=doc(collection(db,"questions"));
 try{await runTransaction(db,async t=>{const u=(await t.get(uref)).data();if(u.credit_balance<1)throw new Error("NOCREDIT");
  const rs=u.last_reset_date!==today()?{daily_votes_count:0,daily_answers_count:0,last_reset_date:today()}:{};
  t.set(qref,{user_id:user.uid,text,category:c,created_at:serverTimestamp()});t.update(uref,{credit_balance:u.credit_balance-1,...rs})});
  $("cin").value="";$("cin").style.height="auto";$("sp").classList.remove("show");cat=c;tabs();await refreshProfile();await loadFeed();toast("Question posted")}
 catch(e){toast(e.message==="NOCREDIT"?"Earn credit by voting or answering 5 times today":"Failed: "+e.message)}}

/* answer */
async function answer(){
 const text=$("ain").value.trim();if(text.length<3){toast("Answer too short");return}
 const words=text.split(/\s+/).length,secs=answerT0?(Date.now()-answerT0)/1000:0,flag=words>80&&secs<8;
 const uref=doc(db,"users",user.uid),aref=doc(collection(db,"answers"));
 try{await runTransaction(db,async t=>{const u=(await t.get(uref)).data();
  t.set(aref,{question_id:active.id,user_id:user.uid,text,upvotes:0,downvotes:0,report_count:0,flagged:flag,created_at:serverTimestamp()});t.update(uref,bump(u,"answers"))});
  $("ain").value="";answerT0=0;await refreshProfile();await loadAnswers();toast(flag?"Posted — flagged for review":"Answer posted")}
 catch(e){toast("Failed: "+e.message)}}

/* vote */
async function vote(aid,type){
 if(!user){openAuth("signup");return}
 const uref=doc(db,"users",user.uid),aref=doc(db,"answers",aid),vref=doc(db,"votes",user.uid+"_"+aid);
 try{await runTransaction(db,async t=>{const[u,a,v]=await Promise.all([t.get(uref),t.get(aref),t.get(vref)]);
  if(!a.exists())return;if(a.data().user_id===user.uid)throw new Error("You can't vote on your own answer");
  let up=a.data().upvotes,dn=a.data().downvotes;const prev=v.exists()?v.data().vote_type:null;
  if(prev==="up")up--;if(prev==="down")dn--;
  if(prev===type)t.delete(vref);else{type==="up"?up++:dn++;t.set(vref,{user_id:user.uid,answer_id:aid,vote_type:type})}
  t.update(aref,{upvotes:up,downvotes:dn});if(!v.exists())t.update(uref,bump(u.data(),"votes"))});
  await refreshProfile();await loadAnswers()}
 catch(e){toast(e.message)}}

async function report(aid){
 if(!user){openAuth("signin");return}
 const r=doc(db,"reports",user.uid+"_"+aid);
 try{if((await getDoc(r)).exists())return toast("You already reported this");
  await setDoc(r,{user_id:user.uid,answer_id:aid});await updateDoc(doc(db,"answers",aid),{report_count:increment(1)});
  toast("Reported. Hidden after 3 reports.");loadAnswers()}
 catch(e){toast("Failed: "+e.message)}}

/* live question matching */
async function ensureSearchIndex(){
 if(sIndex.loaded||sIndex.loading)return;
 sIndex.loading=true;
 try{const[q,a]=await Promise.all([getDocs(query(collection(db,"questions"),orderBy("created_at","desc"),limit(300))),getDocs(query(collection(db,"answers"),orderBy("created_at","desc"),limit(600)))]);
  sIndex.questions=q.docs.map(x=>({id:x.id,...x.data(),_tok:tokenize(x.data().text)}));sIndex.top={};
  a.forEach(x=>{const r={id:x.id,...x.data()};if((r.report_count||0)>=3)return;if(!sIndex.top[r.question_id]||score(r)>score(sIndex.top[r.question_id]))sIndex.top[r.question_id]=r});
  sIndex.loaded=true}
 catch(e){console.warn("search index failed",e.message)}
 finally{sIndex.loading=false}}
function matchQuestions(text){
 const qtok=tokenize(text);if(!qtok.length)return[];
 return sIndex.questions.map(q=>({q,n:qtok.filter(t=>q._tok.includes(t)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,5).map(x=>x.q)}
function renderSearchPanel(matches){
 const p=$("sp");
 if(!matches.length){p.classList.remove("show");p.innerHTML="";return}
 p.innerHTML=matches.map(q=>{const a=sIndex.top[q.id],n=a?a.upvotes+a.downvotes:0,prev=a?esc(a.text).slice(0,110)+(a.text.length>110?"…":""):"No answers yet";
  return`<div class="spi" data-sq="${q.id}"><div class="spq">${esc(q.text)}</div><div class="spa">${prev}</div><div class="spm">${esc(q.category)} · ${n} vote${n===1?"":"s"}</div></div>`}).join("");
 p.classList.add("show")}


document.addEventListener("click",e=>{const t=e.target,g=s=>t.closest(s);
 let b;
 if(b=g("[data-sq]")){$("sp").classList.remove("show");openQ(b.dataset.sq)}
 else if(b=g("[data-mine]")){view="mine";tabs();loadMine()}
 else if(b=g("[data-cat]")){view="feed";cat=b.dataset.cat;tabs();renderFeed()}
 else if(b=g("[data-open]"))openQ(b.dataset.open);
 else if(b=g("[data-v]"))vote(b.dataset.id,b.dataset.v);
 else if(b=g("[data-rep]"))report(b.dataset.rep);
 else if(b=g("[data-close]"))close(b.dataset.close);
 else if(b=g("[data-mode]"))setMode(b.dataset.mode);
 else if(t.classList.contains("ov"))close(t.id);
 if(!g("#menu")&&!g("#avBtn"))$("menu").classList.remove("show");
 if(!g("#sp")&&!g("#cin"))$("sp").classList.remove("show")});
$("avBtn").onclick=()=>$("menu").classList.toggle("show");
$("out").onclick=async()=>{await signOut(auth);$("menu").classList.remove("show");toast("Signed out")};
$("sinBtn").onclick=()=>openAuth("signin");
$("home").onclick=e=>{e.preventDefault();cat="All";view="feed";tabs();loadFeed();scrollTo({top:0,behavior:"smooth"})};
$("go").onclick=doAuth;$("send").onclick=ask;$("sub").onclick=answer;
$("gg").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());close("aov")}catch(e){if(!/popup-closed|cancelled-popup/.test(e.code))$("err").textContent=e.message.replace("Firebase: ","")}};
$("cin").addEventListener("input",e=>{const el=e.target;el.style.height="auto";el.style.height=Math.min(el.scrollHeight,120)+"px";
 clearTimeout(sTimer);const val=el.value;
 if(!val.trim()){$("sp").classList.remove("show");return}
 sTimer=setTimeout(async()=>{await ensureSearchIndex();if(el.value.trim()===val.trim())renderSearchPanel(matchQuestions(val))},300)});
$("cin").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();ask()}});
$("ain").addEventListener("paste",e=>{e.preventDefault();toast("Paste is disabled — write it yourself")});
$("ain").addEventListener("drop",e=>e.preventDefault());
$("ain").addEventListener("contextmenu",e=>e.preventDefault());
$("ain").addEventListener("keydown",()=>{if(!answerT0)answerT0=Date.now()});

onAuthStateChanged(auth,async u=>{user=u;profile=null;
 if(u)try{profile=await ensureProfile(u)}catch(e){toast("Profile error: "+e.message)}
 paint();tabs();loadFeed()});
tabs();setMode("signup");
</script>
